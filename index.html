<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Database Carboidrati</title>
    <style>
      body {
        background-image: url("bilancia_carboidrati.jpg");
        background-size: cover;
        background-position: center;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .contenitore {
        background-color: rgba(0, 0, 0, 0.6);
        padding: 30px;
        border-radius: 15px;
        text-align: center;
      }

      label {
        font-size: 18px;
        font-weight: bold;
        display: block;
        margin-top: 10px;
      }

      input {
        padding: 8px;
        border-radius: 8px;
        border: none;
        margin: 5px;
        font-size: 16px;
        width: 100%;
      }

      button {
        margin-top: 15px;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background-color: #e94560;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #c73652;
      }
    </style>
  </head>
  <body>
    <div class="contenitore">
      <h1>Database Carboidrati</h1>
      <form>
        <label>Nome:</label>
        <input type="text" id="nome">
        
        <label>Percentuale Carboidrati:</label>
        <input type="number" id="carboidrati">
        
        <button type="button" onclick="invia()">Invia</button>
      </form>
    </div>

    <script>
      function invia() {
        const nome = document.getElementById("nome").value;
        const carboidrati = document.getElementById("carboidrati").value;

        fetch("https://script.google.com/macros/s/AKfycbwhyFRKxPH6oDZoiWUHoenbJ01onlhpJkxxZp_ArJ0-rcF6ubf354j9BSL190P-YE6_aw/exec", {
          method: "POST",
          body: JSON.stringify({ nome: nome, carboidrati: carboidrati })
        })
        .then(response => response.json())
        .then(data => {
          console.log(data);
          document.getElementById("nome").value = "";
          document.getElementById("carboidrati").value = "";
        })
        .catch(err => console.log("Errore:", err));
      }
    </script>
  </body>
</html>
