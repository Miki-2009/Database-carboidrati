<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <title>Database Carboidrati</title>
  <style>
    body {
      background-color: #1a1a2e;
      background-image: url("bilancia_carboidrati.jpg");
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
  </style>
</head>
  <body>
    <form>
      <label>Nome:</label>
      <input type="text" id="nome">
      
      <label>Carboidrati:</label>
      <input type="number" id="carboidrati">
      
      <button type="button" onclick="invia()">Invia</button>
    </form>

    <script>
      function invia() {
  const nome = document.getElementById("nome").value;
  const carboidrati = document.getElementById("carboidrati").value;

  fetch("https://script.google.com/macros/s/AKfycbwhyFRKxPH6oDZoiWUHoenbJ01onlhpJkxxZp_ArJ0-rcF6ubf354j9BSL190P-YE6_aw/exec", {
    method: "POST",
    body: JSON.stringify({ nome: nome, carboidrati: carboidrati })
  })
  .then(response => response.json())
  .then(data => {
  console.log(data);
  document.getElementById("nome").value = "";
  document.getElementById("carboidrati").value = "";
  })
  .catch(err => console.log("Errore:", err));
}
    </script>
  </body>
</html>
